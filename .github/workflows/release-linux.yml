name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux bundles
        env:
          NO_BUMP: "1"
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Strip conflicting Wayland/EGL libraries & repack AppImage
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/RapidReady.AppDir"
          APPIMAGE_PATH="$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)"
          if [ ! -d "$APPDIR" ] || [ ! -f "$APPIMAGE_PATH" ]; then
            echo "Missing AppDir ($APPDIR) or AppImage ($APPIMAGE_PATH)"
            exit 1
          fi

          rm -f \
            "$APPDIR"/usr/lib/libwayland* \
            "$APPDIR"/usr/lib/libEGL* \
            "$APPDIR"/usr/lib/libGL* \
            "$APPDIR"/usr/lib/libgbm* \
            "$APPDIR"/usr/lib/libepoxy* \
            "$APPDIR"/usr/lib/x86_64-linux-gnu/libwayland* \
            "$APPDIR"/usr/lib/x86_64-linux-gnu/libEGL* \
            "$APPDIR"/usr/lib/x86_64-linux-gnu/libGL* \
            "$APPDIR"/usr/lib/x86_64-linux-gnu/libgbm* \
            "$APPDIR"/usr/lib/x86_64-linux-gnu/libepoxy*

          APPIMAGETOOL="$(find "$HOME/.cache/tauri" -maxdepth 2 -type f -name '*appimagetool*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$APPIMAGETOOL" ] || [ ! -f "$APPIMAGETOOL" ]; then
            APPIMAGETOOL="/tmp/appimagetool"
            curl -fSL -o "$APPIMAGETOOL" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x "$APPIMAGETOOL"
          fi

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGETOOL" --no-appstream "$APPDIR" "$APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"

      - name: Verify bundles & glibc baseline
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/RapidReady.AppDir"
          if find "$APPDIR/usr/lib" -maxdepth 2 \( -name 'libwayland*' -o -name 'libEGL*' -o -name 'libGL*' -o -name 'libgbm*' -o -name 'libepoxy*' \) | grep -q .; then
            echo "Conflicting graphics libraries still present!"
            exit 1
          fi
          ls -lh src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm
          objdump -T src-tauri/target/release/rapid-ready | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 5

      - name: Upload Linux bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rapidready-linux-bundles
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: RapidReady ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
