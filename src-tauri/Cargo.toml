[package]
name = "rapid-ready"
version = "0.6.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rapid_ready_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapidready-core = { version = "0.6.4", path = "crates/rapidready-core" }
tauri-plugin-dialog = "2"
urlencoding = "2.1.3"
trash = "5.2.6"
tauri-plugin-window-state = "2.4.1"
notify = "8.2.0"
open = "5"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same version Tauri/tao already link on Linux (no extra build cost); used to follow the
# GDK fullscreen state for hiding the in-window menu bar.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


[workspace]
members = ["crates/rapidready-core"]

[patch.crates-io]
# Not on crates.io (no RustSec coverage): pinned to a reviewed commit so `cargo update`
# cannot silently pull new upstream code. Bump deliberately after reviewing the diff.
thumb-rs = { git = "https://github.com/iamzubin/thumb-rs.git", rev = "2a929c28d3a630627159858deb5433ad9ffb8d11" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
